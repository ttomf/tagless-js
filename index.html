<script>
const HEIGHT = 18;
const HELP = `
commands:
  help                 print this help message
  info                 print info about this
  neofetch             print fancy system info

  echo <text> <file?>  print <text>, optionally to <file>

  ls                   print all files
  touch <file>         create empty <file>
  rm <file>            delete <file>
  cat <file>           print content of <file>

  reset                reset the page and clean storage
  eval <command>       execute JS code and return output

  date                 print date and time
  whoami               print user name

  spoil                print all easter eggs here

`;
const INFO = `
info:
  This is site created only using <script> tags,
  it runs in <body> with some styling (using JS).

  GitHub repo: https://github.com/ttomf/tagless-js

Try \`help\` for all commands.
`;
const SPOIL = `
rm -rf /
sudo rm -rf /
exit
vim
kill 1
:(){ :|:& };:
`;
const NEOFETCH = `
                             guest@tagless-js
   ▄▄▄▄      ██  ▄▄▄▄        ----------------
 ▄██▀▀▀     ██   ▀▀▀██▄      OS: TaglessJS
██         ██         ██     Host: Browser
 ▀██▄▄▄   ██     ▄▄▄██▀      Files: $FILES
   ▀▀▀▀  ██      ▀▀▀▀        Storage: localStorage
        Tagless              Time: $TIME
                             Terminal size: $SIZE
`;

function draw() {
  const tmpBuffer = structuredClone(buffer);
  if (cursor.canWrite) {
    tmpBuffer[cursor.y][cursor.x] = "█";
  }
  let drawBuffer = [];
  for (let i of tmpBuffer) {
    drawBuffer.push(i.join(""));
  }
  body.innerText = drawBuffer.join("\n");
}

function recomputeSize() {
  ctx.font = getComputedStyle(body).font;
  const m = ctx.measureText("M");

  const newSize = {
    w: Math.floor(document.documentElement.clientWidth / m.width),
    h: Math.floor(document.documentElement.clientHeight / HEIGHT),
  };

  const delta = newSize.h - size.h;

  size = newSize;

  if (delta > 0) {
    buffer.unshift(
      ...Array(delta)
        .fill(null)
        .map(() => []),
    );
    cursor.y += delta;
  }

  if (delta < 0) {
    buffer.splice(0, -delta);
    cursor.y += delta;
  }

  cursor.y = Math.max(0, Math.min(cursor.y, size.h - 1));

  for (const line of buffer) {
    if (line.length < size.w) {
      line.push(...Array(size.w - line.length).fill(" "));
    } else if (line.length > size.w) {
      line.splice(size.w);
    }
  }

  draw();
}

function run(cmd) {
  switch (cmd) {
    case "rm -rf /":
      print("\nNice try.\n");
      return;
    case "sudo rm -rf /":
      print("\nDeleting system...\n");
      print("Done.");
      cursor.canWrite = false;
      setInterval(() => {
        const chars =
          "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
        for (let i = 0; i < 100; i++) {
          buffer[Math.floor(Math.random() * size.h)][
            Math.floor(Math.random() * size.w)
          ] = chars[Math.floor(Math.random() * chars.length)];
        }
        print("---SYSTEM CRASH---", {
          x: Math.floor(size.w / 2) - 9,
          y: Math.floor(size.h / 2),
        });
        draw();
      }, 0);
      return;
    case "exit":
      print("\nThere is no escape.\n");
      return;
    case "vim":
      print("\nYou think you could exit it?\n");
      return;
    case "kill 1":
      cursor.canWrite = false;
      setTimeout(() => {
        for (let x = 0; x < size.w; x++) {
          for (let y = 0; y < size.h; y++) {
            buffer[y][x] = " ";
          }
        }
        draw();
      }, 0);
      return;
    case ":(){ :|:& };:":
      cursor.canWrite = false;
      print(
        "\nWHAT ARE YOU TRYING TO DO???\nAnyway here you go...\nStarting while (true);\n",
      );
      draw();
      setTimeout(() => {
        while (true);
      }, 0);
      return;
  }

  const args = cmd
    .match(/"[^"]*"|\S+/g)
    ?.map((arg) => arg.replace(/^"|"$/g, "")) || [""];

  switch (args[0]) {
    case "":
      print("\n");
      break;
    case "echo":
      if (args[1]) {
        if (args[2]) {
          files[args[2]] = args[1].replaceAll("\\n", "\n");
          localStorage.setItem("files", JSON.stringify(files));
          print("\n");
        } else {
          print("\n" + (args[1].replaceAll("\\n", "\n") ?? "") + "\n");
        }
      } else {
        print("\n");
      }
      break;
    case "help":
      print(HELP);
      break;
    case "info":
      print(INFO);
      break;
    case "ls":
      print("\n" + Object.keys(files).join(" ") + "\n");
      break;
    case "touch":
      if (args[1]) {
        files[args[1]] = "";
        localStorage.setItem("files", JSON.stringify(files));
        print("\n");
      } else {
        print("\nNo file specified. Try `help`.\n");
      }
      break;
    case "rm":
      if (args[1]) {
        if (args[1] in files) {
          delete files[args[1]];
          localStorage.setItem("files", JSON.stringify(files));
          print("\n");
        } else {
          print("\nFile " + args[1] + " doesn't exist.\n");
        }
      } else {
        print("\nNo file specified. Try `help`.\n");
      }
      break;
    case "cat":
      if (args[1]) {
        if (args[1] in files) {
          print("\n" + files[args[1]] + "\n");
        } else {
          print("\nFile " + args[1] + " doesn't exist.\n");
        }
      } else {
        print("\nNo file specified. Try `help`.\n");
      }
      break;
    case "reset":
      localStorage.clear();
      window.location.reload();
      break;
    case "eval":
      print("\n" + eval(args?.[1] ?? "") + "\n");
      break;
    case "date":
      print("\n" + new Date().toString() + "\n");
      break;
    case "whoami":
      print("\nguest\n");
      break;
    case "neofetch":
      const now = new Date();
      const time =
        String(now.getHours()).padStart(2, "0") +
        ":" +
        String(now.getMinutes()).padStart(2, "0") +
        ":" +
        String(now.getSeconds()).padStart(2, "0");
      print(
        NEOFETCH.replace("$FILES", Object.keys(files).length)
          .replace("$TIME", time)
          .replace("$SIZE", size.w + "x" + size.h),
      );
      break;
    case "spoil":
      print(SPOIL);
      break;
    default:
      print("\nUnknown command: " + args[0] + ". Try `help`.\n");
      break;
  }
}

function input(letter) {
  if (cursor.canWrite) {
    let line = buffer[cursor.y].join("");
    if (/^\P{Cc}$/u.test(letter)) {
      if (cursor.x + 1 < size.w) {
        print(letter);
      }
    } else if (letter == "Enter") {
      let cmd = line.slice(line.lastIndexOf("# ") + 2, cursor.x);
      run(cmd.trim());
      if (cursor.canWrite) {
        print("# ");
      }
    } else if (letter == "Backspace") {
      if (line.slice(line.lastIndexOf("# "), cursor.x) != "# ") print("\b");
    } else {
      console.log(letter);
    }
  }
  draw();
}

function print(text, where = undefined) {
  let offset = 0;
  let pos = where;
  if (where === undefined) {
    pos = {
      x: cursor.x,
      y: cursor.y,
    };
  }
  if (pos.y + 1 > size.h) {
    buffer.shift();
    buffer.push(Array(size.w).fill(" "));
    pos.y -= 1;
  }
  for (const [i, l] of Array.from(text).entries()) {
    if (/^\P{Cc}$/u.test(l)) {
      if (pos.x + i - offset + 1 < size.w) {
        buffer[pos.y][pos.x + i - offset] = l;
        if (where === undefined) {
          cursor.x = pos.x + i - offset + 1;
        }
        draw();
      }
    }
    if (l == "\n") {
      offset = i + 1;
      if (where === undefined) {
        cursor.x = 0;
        cursor.y += 1;
      }
      pos.x = 0;
      pos.y += 1;
      if (pos.y + 1 > size.h) {
        buffer.shift();
        buffer.push(Array(size.w).fill(" "));
        pos.y -= 1;
        cursor.y -= 1;
      }
    }
    if (l == "\r") {
      pos.x = 0;
      cursor.x = 0;
    }
    if (l == "\b") {
      if (pos.x > 0) {
        buffer[pos.y][pos.x + i] = " ";
        pos.x -= 1;
        if (where === undefined) {
          cursor.x = pos.x + i;
        }
      }
    }
  }
}

function main() {
  body = document.body;
  ctx = document.createElement("canvas").getContext("2d");

  body.style.backgroundColor = "black";
  body.style.color = "#00AA00";
  body.style.fontFamily = "JetBrains Mono Nerd";
  body.style.fontSize = "16px";
  body.style.lineHeight = HEIGHT + "px";
  body.style.width = "100vw";
  body.style.height = "100vh";
  body.style.margin = "0";
  body.style.whiteSpace = "pre";

  recomputeSize();

  new ResizeObserver(recomputeSize).observe(document.documentElement);

  run("neofetch");
  run("info");
  print("# ");

  body.addEventListener("keydown", (e) => {
    if (!e.key.startsWith("F")) e.preventDefault();
    input(e.key);
  });
}

var body, ctx;
var buffer = [];
var files = JSON.parse(localStorage.getItem("files") ?? "{}");
var size = {
  w: 0,
  h: 0,
};
var cursor = {
  x: 0,
  y: 0,
  canWrite: true,
};

document.addEventListener("DOMContentLoaded", () => {
  const fontFile = new FontFace(
    "JetBrains Mono Nerd",
    'url("https://cdn.jsdelivr.net/gh/Nick2bad4u/nerd-fonts-woff2@main/fonts/woff2/DejaVuSansMono/DejaVuSansMNerdFont-Regular.woff2")',
  );

  document.fonts.add(fontFile);

  fontFile.load().then(
    () => main(),
    (err) => console.error(err),
  );
});
</script>
