<script>
const HEIGHT = 16;
const HELP = `
info:
  This is site created only using <script> tags,
  it runs in <body> with some styling (using JS).

  GitHub repo: https://github.com/ttomf/tagless-js

commands:
  help           print this help message
  echo <text>    print <text>

`;

function draw() {
  const tmpBuffer = structuredClone(buffer);
  tmpBuffer[cursor.y][cursor.x] = "█";
  let drawBuffer = [];
  for (let i of tmpBuffer) {
    drawBuffer.push(i.join(""));
  }
  body.innerText = drawBuffer.join("\n");
}

function recomputeSize() {
  ctx.font = getComputedStyle(body).font;
  const m = ctx.measureText("M");

  const newSize = {
    w: Math.floor(document.documentElement.clientWidth / m.width),
    h: Math.floor(document.documentElement.clientHeight / HEIGHT),
  };

  const delta = newSize.h - size.h;

  size = newSize;

  if (delta > 0) {
    buffer.unshift(
      ...Array(delta)
        .fill(null)
        .map(() => []),
    );
    cursor.y += delta;
  }

  if (delta < 0) {
    buffer.splice(0, -delta);
    cursor.y += delta;
  }

  cursor.y = Math.max(0, Math.min(cursor.y, size.h - 1));

  for (const line of buffer) {
    if (line.length < size.w) {
      line.push(...Array(size.w - line.length).fill(" "));
    } else if (line.length > size.w) {
      line.splice(size.w);
    }
  }

  draw();
}

function run(cmd) {
  const args = cmd.split(" ");
  switch (args[0]) {
    case "":
      print("\n");
      break;
    case "echo":
      print("\n" + args?.[1] + "\n");
      break;
    case "help":
      print(HELP);
      break;
    default:
      print("\nUnknown command: " + args[0] + ". Try `help`.\n");
      break;
  }
}

function input(letter) {
  if (cursor.canWrite) {
    let line = buffer[cursor.y].join("");
    if (/^\P{Cc}$/u.test(letter)) {
      if (cursor.x + 1 < size.w) {
        print(letter);
      }
    } else if (letter == "Enter") {
      let cmd = line.slice(line.lastIndexOf("# ") + 2, cursor.x);
      console.log(cmd);
      run(cmd);
      print("# ");
    } else if (letter == "Backspace") {
      if (line.slice(line.lastIndexOf("# "), cursor.x) != "# ") print("\b");
    }
  }
  draw();
}

function print(text, where = undefined) {
  let offset = 0;
  let pos = where;
  if (where === undefined) {
    pos = {
      x: cursor.x,
      y: cursor.y,
    };
  }
  if (pos.y + 1 > size.h) {
    buffer.shift();
    buffer.push(Array(size.w).fill(" "));
    pos.y -= 1;
  }
  for (const [i, l] of Array.from(text).entries()) {
    if (/^\P{Cc}$/u.test(l)) {
      if (pos.x + i - offset + 1 < size.w) {
        buffer[pos.y][pos.x + i - offset] = l;
        if (where === undefined) {
          cursor.x = pos.x + i - offset + 1;
        }
        draw();
      }
    }
    if (l == "\n") {
      offset = i + 1;
      if (where === undefined) {
        cursor.x = 0;
        cursor.y += 1;
      }
      pos.x = 0;
      pos.y += 1;
      if (pos.y + 1 > size.h) {
        buffer.shift();
        buffer.push(Array(size.w).fill(" "));
        pos.y -= 1;
        cursor.y -= 1;
      }
    }
    if (l == "\r") {
      pos.x = 0;
      cursor.x = 0;
    }
    if (l == "\b") {
      if (pos.x > 0) {
        buffer[pos.y][pos.x + i] = " ";
        pos.x -= 1;
        if (where === undefined) {
          cursor.x = pos.x + i;
        }
      }
    }
  }
}

function main() {
  body = document.body;
  ctx = document.createElement("canvas").getContext("2d");

  body.style.backgroundColor = "black";
  body.style.color = "#00AA00";
  body.style.fontFamily = "JetBrains Mono Nerd";
  body.style.fontSize = "16px";
  body.style.lineHeight = HEIGHT + "px";
  body.style.width = "100vw";
  body.style.height = "100vh";
  body.style.margin = "0";
  body.style.whiteSpace = "pre";

  recomputeSize();

  new ResizeObserver(recomputeSize).observe(document.documentElement);

  print(HELP);
  print("# ");

  body.addEventListener("keydown", (e) => {
    if (!e.key.startsWith("F")) e.preventDefault();
    input(e.key);
  });
}

var body, ctx;
var buffer = [];
var size = {
  w: 0,
  h: 0,
};
var cursor = {
  x: 0,
  y: 0,
  canWrite: true,
};

document.addEventListener("DOMContentLoaded", () => {
  const fontFile = new FontFace(
    "JetBrains Mono Nerd",
    'url("https://cdn.jsdelivr.net/gh/Nick2bad4u/nerd-fonts-woff2@main/fonts/woff2/DejaVuSansMono/DejaVuSansMNerdFont-Regular.woff2")',
  );

  document.fonts.add(fontFile);

  fontFile.load().then(
    () => main(),
    (err) => console.error(err),
  );
});
</script>
